online_navigator:
  ros__parameters:
    robot_radius: 0.18
    inflation_radius: 0.40
    frontier_stand_off: 0.45
    goal_weight: 1.0
    goal_tolerance: 0.15
    stall_timeout: 20.0
    map_timeout: 4.0
    pose_timeout: 0.5

slam_pose:
  ros__parameters:
    base_frame: base_footprint
    transform_timeout: 1.0

planner:
  ros__parameters:
    max_access_cost: 90

controller:
  ros__parameters:
    frequency: 20.0
    lookahead_distance: 0.20
    lookahead_lin_vel: 0.10
    stop_thres: 0.08
    max_lin_vel: 0.20
    max_ang_vel: 1.0
    data_timeout: 2.0
    heading_align_threshold: 0.7

online_safety:
  ros__parameters:
    robot_radius: 0.18
    base_frame: base_footprint
    map_timeout: 4.0
    sensor_timeout: 0.6
    command_timeout: 0.3
    prediction_horizon: 0.8
